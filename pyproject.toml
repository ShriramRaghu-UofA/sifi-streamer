[project]
name = "sifi-streamer"
version = "0.3.1"
description = "Reusable SiFi acquisition, live streaming, and authoritative capture logging"
readme = "README.md"
requires-python = ">=3.14"
license = {text = "Proprietary"}
dependencies = [
    "numpy>=2.5",
]

[project.scripts]
sifi-capture = "sifi_streamer.cli:main"
sifi-capture-web = "sifi_streamer.web_cli:main"
sifi-download-bridge = "sifi_streamer.bridge_download:main"

[project.optional-dependencies]
parquet = ["pandas>=3", "pyarrow>=24"]

[dependency-groups]
dev = [
    "ruff>=0.16.1",
    "ty>=0.0.71",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sifi_streamer"]

[tool.hatch.build]
exclude = ["frontend/node_modules"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
