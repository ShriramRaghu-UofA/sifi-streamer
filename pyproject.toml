[project]
name = "sifi-streamer"
version = "0.6.4"
description = "Reusable SiFi acquisition, live streaming, and authoritative capture logging"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "numpy>=2.5",
]

[project.scripts]
sifi-capture = "sifi_streamer.sifi.cli.capture:main"
sifi-capture-web = "sifi_streamer.web.cli:main"
sifi-download-bridge = "sifi_streamer.sifi.bridge_install:main"
sifi-sensor-profile = "sifi_streamer.sifi.cli.sensor_profile:main"
sifi-capture-to-parquet = "sifi_streamer.sifi.cli.export:main"

[project.optional-dependencies]
parquet = ["pandas>=3", "pyarrow>=24"]

[dependency-groups]
dev = [
    "pandas>=3",
    "pyarrow>=24",
    "ruff>=0.16.1",
    "ty>=0.0.71",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sifi_streamer"]

[tool.hatch.build]
exclude = ["frontend/node_modules"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
